name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (Verbose Mode)
        # Флаг --frozen-lockfile и CI=true отключают любые вопросы от терминала
        run: |
          echo "=== Начинаем установку пакетов ==="
          bun install --frozen-lockfile
        env:
          CI: true

      - name: Build project (Verbose Mode)
        # Добавляем подробный вывод логов для Vite
        run: |
          echo "=== Начинаем сборку Vite ==="
          bun run build --debug
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
